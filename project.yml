name: Xolirx
options:
  bundleIdPrefix: org.xolirx
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "2.1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO

targets:
  Xolirx:
    type: application
    platform: iOS
    sources:
      - path: Xolirx
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.xolirx.vpn
        PRODUCT_NAME: XOLIRX
        INFOPLIST_FILE: Xolirx/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Xolirx:
    build:
      targets:
        Xolirx: all
    run:
      config: Debug
    archive:
      config: Release
